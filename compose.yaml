services:

  proxy:
    image: docker.io/nginxproxy/nginx-proxy:1.7.0
    ports:
      - "80:80"
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
    restart: unless-stopped

  shinyproxy:
    image: ghcr.io/kth-library/shinyproxy-kth:3.2.4
    env_file:
      - ./env/.shinyproxyenvkth
    ports:
      - "8080:8080"
    volumes:
      - ./application-oidc-local.yaml:/opt/shinyproxy/application.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./logs:/opt/shinyproxy/container-logs
    environment:
      - VIRTUAL_HOST=localhost
      - VIRTUAL_PORT=8080
    restart: unless-stopped

networks:
  default:
    name: sp-net
